<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form HTML5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="bg-white d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="container">

        <div class="p-3 bg-light border rounded-top">
            <h3>Payment form example</h3>
        </div>
        <div class="border p-4">
            <div class="alert alert-danger" role="alert">
                Some fields are missing
            </div>


            <div class="row position-relative">
                <div class="mb-3 col-4">
                    <label for="basic-url" class="form-label">Card #</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="basic-url"
                            aria-describedby="basic-addon3 basic-addon4">
                    </div>
                </div>
                <div class="mb-3 col-4">
                    <label for="basic-url" class="form-label">CVC #</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="basic-url"
                            aria-describedby="basic-addon3 basic-addon4">
                    </div>
                </div>
                <div class="mb-3 col-4">
                    <label for="basic-url" class="form-label">Amount</label>
                    <div class="input-group">
                        $
                        <input type="text" class="form-control" id="basic-url"
                            aria-describedby="basic-addon3 basic-addon4">
                    </div>
                </div>

                <div class="mb-3 col-6">
                    <label for="basic-url" class="form-label">First Name</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="basic-url"
                            aria-describedby="basic-addon3 basic-addon4">
                    </div>
                </div>
                <div class="mb-3 col-6">
                    <label for="basic-url" class="form-label">Last name</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="basic-url"
                            aria-describedby="basic-addon3 basic-addon4">
                    </div>
                </div>
                <div class="mb-3 col-6">
                    <label for="basic-url" class="form-label">City</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="basic-url"
                            aria-describedby="basic-addon3 basic-addon4">
                    </div>
                </div>
                <div class="mb-3 col-3">
                    <label for="basic-url" class="form-label">State</label>
                    <select id="disabledSelect" class="form-select">
                        <option selected>Pick a State</option>
                        <option value="1">Florida</option>
                        <option value="2">New York</option>
                        <option value="3">California</option>
                    </select>
                </div>
                <div class="mb-3 col-3">
                    <label for="basic-url" class="form-label">Postal Code</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="basic-url"
                            aria-describedby="basic-addon3 basic-addon4">
                    </div>
                </div>

                <div class="mb-3 col-3">
                    <p>We accept:</p>
                    <div class="border border-secondary bg-secondary">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1"
                                value="option1">
                            <label class="form-check-label" for="inlineRadio1"><i
                                    class="fa-brands fa-cc-mastercard"></i></label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2"
                                value="option2">
                            <label class="form-check-label" for="inlineRadio2"><i
                                    class="fa-brands fa-cc-visa"></i></label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3"
                                value="option3">
                            <label class="form-check-label" for="inlineRadio3"><i
                                    class="fa-brands fa-cc-diners-club"></i></label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio4"
                                value="option4">
                            <label class="form-check-label" for="inlineRadio4"><i
                                    class="fa-brands fa-cc-apple-pay"></i></label>
                        </div>
                    </div>
                </div>

                <div class="mb-3 col-3 text-white-50">
                    no se como espaciar esto!!!!!!
                </div>

                <div class=" mb-3 col-6">
                    <label for="message">Message</label>
                    <textarea class="form-control m-1" id="message" style="height: 100px"></textarea>
                    <p class="form-text">
                        Add any notes here
                    </p>
                </div>

            </div>

        </div>
        <div class="p-3 bg-light border rounded-bottom d-flex justify-content-end gap-2">
            <button class="btn btn-secondary">Cancel</button>
            <button class="btn btn-primary">Send</button>
        </div>
    </div>
    </div>
</body>

</html>
